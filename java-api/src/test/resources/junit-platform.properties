# Configuração do jqwik (equivalente à do fast-check no node-api)
# 100 tentativas por propriedade, geração aleatória e semente nova a cada execução.
jqwik.tries.default = 100
jqwik.generation.default = RANDOMIZED
jqwik.failures.runfirst = false
jqwik.failures.after.default = RANDOM_SEED
jqwik.database = target/.jqwik-database
jqwik.reporting.onlyfailures = true
