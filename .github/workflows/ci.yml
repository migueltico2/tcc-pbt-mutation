name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes (exemplos + propriedades + REST/Spring)
        run: mvn -B test
      - name: Mutação com PIT (plugin Maven), suíte fraca
        run: |
          mvn -B test-compile org.pitest:pitest-maven:mutationCoverage
          python3 ../scripts/resumo_pit.py target/pit-reports/mutations.xml fraca
          mkdir -p ../pit-fraca && cp -r target/pit-reports/* ../pit-fraca/
      - name: Mutação com PIT (plugin Maven), suíte forte
        run: |
          mvn -B test-compile org.pitest:pitest-maven:mutationCoverage -Psuite-forte
          python3 ../scripts/resumo_pit.py target/pit-reports/mutations.xml forte
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-reports
          path: |
            pit-fraca
            java-api/target/pit-reports

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node-api/package-lock.json
      - run: npm ci
      - name: Testes (exemplos + propriedades + REST)
        run: npm test
      - name: Mutação com StrykerJS, suíte fraca
        run: npx stryker run
      - name: Mutação com StrykerJS, suíte forte
        run: SUITE=forte npx stryker run
